<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reach Out — Devon Ba Dour</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000000;
            color: #F9F6EE;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
        }

        :root {
            --page-padding: 2rem;
            --small-text: 11px;
        }

        /* NAVIGATION */

        .site-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem var(--page-padding);
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            column-gap: 2rem;
            align-items: start;
            z-index: 1000;
        }

        .nav-name,
        .nav-link {
            color: #ffffff;
            text-decoration: none;
            line-height: 1;
            transition: opacity 0.25s ease;
        }

        .nav-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .nav-link {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        .nav-name:hover,
        .nav-link:hover {
            opacity: 0.5;
        }

        /* MAIN */

        .contact-page {
            min-height: 100vh;
            padding: 6rem var(--page-padding) 2rem var(--page-padding);
            display: flex;
            flex-direction: column;
        }

        .contact-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            align-items: start;
        }

        .contact-label {
            font-size: var(--small-text);
            text-transform: uppercase;
            line-height: 1;
            opacity: 0.7;
        }

        .contact-title {
            margin: 0;
            font-size: clamp(3rem, 7vw, 8rem);
            font-weight: 400;
            line-height: 0.85;
            letter-spacing: -0.055em;
            text-transform: uppercase;
        }

        /* CONTACT LINKS */

        .contact-links {
            margin-top: auto;
            padding-top: 10rem;
        }

        .contact-link {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 2rem;
            align-items: end;
            padding: 1.25rem 0;
            border-top: 1px solid rgba(249, 246, 238, 0.35);
            color: #F9F6EE;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        .contact-link:last-child {
            border-bottom: 1px solid rgba(249, 246, 238, 0.35);
        }

        .contact-link:hover {
            opacity: 0.5;
        }

        .contact-type {
            font-size: var(--small-text);
            text-transform: uppercase;
            line-height: 1;
        }

        .contact-value {
            font-size: clamp(1.5rem, 3vw, 3rem);
            line-height: 0.95;
            letter-spacing: -0.035em;
            text-transform: uppercase;
        }

        .contact-arrow {
            font-size: 18px;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        .contact-link:hover .contact-arrow {
            transform: translateX(6px);
        }

        /* FOOTER */

        .site-footer {
            margin-top: 8rem;
        }

        .footer-line {
            width: 100%;
            height: 1px;
            background: rgba(249, 246, 238, 0.35);
            margin-bottom: 1.5rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 2rem;
            align-items: start;
        }

        .footer-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
        }

        .footer-link {
            color: #F9F6EE;
            font-size: 14px;
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        .footer-link:hover {
            opacity: 0.5;
        }

        .footer-bottom {
            margin-top: 5rem;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            line-height: 1;
            opacity: 0.55;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            :root {
                --page-padding: 1rem;
            }

            .site-nav {
                position: relative;
                padding: 1rem;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            .nav-name {
                grid-column: span 2;
                font-size: 14px;
            }

            .nav-link {
                font-size: 12px;
            }

            .contact-page {
                min-height: calc(100vh - 100px);
                padding: 4rem 1rem 1rem 1rem;
            }

            .contact-header {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .contact-title {
                font-size: clamp(3.5rem, 16vw, 7rem);
            }

            .contact-links {
                padding-top: 7rem;
            }

            .contact-link {
                grid-template-columns: 1fr auto;
                gap: 0.75rem;
                padding: 1rem 0;
            }

            .contact-type {
                grid-column: 1;
                grid-row: 1;
                align-self: start;
            }

            .contact-value {
                grid-column: 1;
                grid-row: 2;
                font-size: clamp(1.4rem, 7vw, 2.5rem);
            }

            .contact-arrow {
                grid-column: 2;
                grid-row: 2;
            }

            .site-footer {
                margin-top: 5rem;
            }

            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            .footer-name {
                grid-column: span 2;
            }

            .footer-link {
                font-size: 12px;
            }

            .footer-bottom {
                margin-top: 4rem;
                display: block;
                line-height: 1.5;
            }

            .footer-bottom span {
                display: block;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>

</head>

    <footer class="site-footer">

        <div class="footer-bottom">

            </span>

        </div>

    </footer>

</html>
